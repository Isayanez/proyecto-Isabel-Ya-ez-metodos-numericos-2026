<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecuaciones Diferenciales - Métodos Numéricos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Ecuaciones Diferenciales Ordinarias (EDO)</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Resolución de ecuaciones dy/dx = f(x, y) mediante métodos numéricos iterativos.</p>

                <div class="row g-4">
                    <!-- Formulario de Entrada -->
                    <div class="col-md-5">
                        <div class="card border-0 bg-white p-3 shadow-sm">
                            <h5 class="fw-bold text-secondary mb-3">Parámetros</h5>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Ecuación dy/dx = f(x, y):</label>
                                <input type="text" id="ecuacion" class="form-control" value="-2*x^3 + 12*x^2 - 20*x + 8.5" placeholder="Ej. -2*x^3 + 12*x^2 - 20*x + 8.5">
                            </div>

                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label fw-bold">x₀ (Inicial):</label>
                                    <input type="number" step="any" id="x0" class="form-control" value="0.0">
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label fw-bold">y₀ = y(x₀):</label>
                                    <input type="number" step="any" id="y0" class="form-control" value="1.0">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label fw-bold">x Final (xf):</label>
                                    <input type="number" step="any" id="xf" class="form-control" value="4.0">
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label fw-bold">Paso (h):</label>
                                    <input type="number" step="any" id="h" class="form-control" value="0.5">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Método:</label>
                                <select id="metodo" class="form-select">
                                    <option value="EULER">Euler Estándar</option>
                                    <option value="EULER_MEJORADO">Euler Mejorado (Heun)</option>
                                    <option value="RK4" selected>Runge-Kutta 4° Orden (RK4)</option>
                                </select>
                            </div>

                            <button onclick="calcularEDO()" class="btn btn-success w-100 fw-bold py-2 mt-2">Calcular EDO</button>
                        </div>
                    </div>

                    <!-- Panel de Resultados -->
                    <div class="col-md-7">
                        <div class="card border-0 bg-white p-3 shadow-sm">
                            <h5 class="fw-bold text-secondary mb-3">Resultados</h5>
                            
                            <div id="loading" class="text-center py-4 d-none">
                                <div class="spinner-border text-primary" role="status"></div>
                                <p class="mt-2 text-muted">Calculando iteraciones...</p>
                            </div>

                            <div id="resultadoContainer" class="d-none">
                                <div class="alert alert-success border-0 shadow-sm">
                                    <h6 class="fw-bold mb-1">Valor Aproximado Final y(xf):</h6>
                                    <span id="resFinal" class="fs-3 fw-bold text-primary">0.0</span>
                                </div>

                                <div class="table-responsive mt-3" style="max-height: 350px; overflow-y: auto;">
                                    <table class="table table-striped table-hover align-middle border">
                                        <thead class="table-dark sticky-top">
                                            <tr>
                                                <th>Paso (i)</th>
                                                <th>xᵢ</th>
                                                <th>yᵢ</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tablaResultados">
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <div id="emptyState" class="text-center text-muted py-5">
                                Proporciona los valores de entrada y presiona <strong>"Calcular EDO"</strong>.
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function calcularEDO() {
            const payload = {
                ecuacion: document.getElementById('ecuacion').value,
                x0: parseFloat(document.getElementById('x0').value),
                y0: parseFloat(document.getElementById('y0').value),
                xf: parseFloat(document.getElementById('xf').value),
                h: parseFloat(document.getElementById('h').value),
                metodo: document.getElementById('metodo').value
            };

            const emptyState = document.getElementById('emptyState');
            const loading = document.getElementById('loading');
            const resultadoContainer = document.getElementById('resultadoContainer');

            emptyState.classList.add('d-none');
            resultadoContainer.classList.add('d-none');
            loading.classList.remove('d-none');

            try {
                const response = await fetch('/api/ecuaciones-diferenciales/calcular', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                loading.classList.add('d-none');

                if (data.exito) {
                    document.getElementById('resFinal').innerText = data.resultadoFinal;

                    const tbody = document.getElementById('tablaResultados');
                    tbody.innerHTML = '';

                    data.tabla.forEach(fila => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><span class="badge bg-secondary">${fila.paso}</span></td>
                            <td>${fila.x}</td>
                            <td class="fw-bold">${fila.y}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    resultadoContainer.classList.remove('d-none');
                } else {
                    alert('Error: ' + data.mensaje);
                    emptyState.classList.remove('d-none');
                }
            } catch (err) {
                loading.classList.add('d-none');
                emptyState.classList.remove('d-none');
                alert('Ocurrió un error al conectar con el servidor.');
            }
        }
    </script>
</body>
</html>
