<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas de Ecuaciones Lineales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar fragmento de Thymeleaf -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-10">

                <!-- Tarjeta Principal de Configuración e Ingreso -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Sistemas de Ecuaciones Lineales</h4>
                    </div>
                    <div class="card-body">
                        <p class="text-muted">Resolución de sistemas mediante Eliminación Gaussiana, Gauss-Jordan, Jacobi y Gauss-Seidel.</p>
                        
                        <!-- Selección de Método y Dimensión -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="metodo" class="form-label fw-bold">Método de Solución:</label>
                                <select id="metodo" class="form-select" onchange="gestionarParametrosIterativos()">
                                    <option value="ELIMINACION_GAUSSIANA">Eliminación Gaussiana</option>
                                    <option value="GAUSS_JORDAN">Gauss-Jordan</option>
                                    <option value="JACOBI">Jacobi (Iterativo)</option>
                                    <option value="GAUSS_SEIDEL">Gauss-Seidel (Iterativo)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="dimension" class="form-label fw-bold">Tamaño del Sistema (n x n):</label>
                                <select id="dimension" class="form-select" onchange="generarMatriz()">
                                    <option value="2">2 x 2</option>
                                    <option value="3" selected>3 x 3</option>
                                    <option value="4">4 x 4</option>
                                    <option value="5">5 x 5</option>
                                </select>
                            </div>
                        </div>

                        <!-- Campos para métodos iterativos (Jacobi / Gauss-Seidel) -->
                        <div id="seccion-iterativos" class="row g-3 mb-4" style="display: none;">
                            <div class="col-md-6">
                                <label for="tolerancia" class="form-label fw-bold">Tolerancia (%):</label>
                                <input type="number" step="any" id="tolerancia" class="form-control" value="0.0001">
                            </div>
                            <div class="col-md-6">
                                <label for="maxIteraciones" class="form-label fw-bold">Max. Iteraciones:</label>
                                <input type="number" id="maxIteraciones" class="form-control" value="100">
                            </div>
                        </div>

                        <!-- Contenedor para Matriz Dinámica A | b -->
                        <h6 class="fw-bold mb-2">Matriz de Coeficientes [A] y Vector de Términos Independientes [b]:</h6>
                        <div class="table-responsive mb-4">
                            <div id="contenedor-matriz"></div>
                        </div>

                        <button type="button" onclick="enviarSistema()" class="btn btn-success w-100 py-2 fw-bold">Resolver Sistema</button>
                    </div>
                </div>

                <!-- Alerta para Errores -->
                <div id="alerta-error" class="alert alert-danger shadow-sm border-0 mb-4" style="display: none;" role="alert">
                    <span id="mensaje-error"></span>
                </div>

                <!-- Tarjeta de Resultados -->
                <div id="seccion-resultados" class="card shadow-sm border-0 mb-4" style="display: none;">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Resultado del Sistema</h5>
                    </div>
                    <div class="card-body">
                        <h6 class="fw-bold mb-3">Vector Solución:</h6>
                        <div id="vector-solucion" class="row text-center mb-4 g-2"></div>
                        
                        <h6 class="fw-bold mb-3">Procedimiento paso a paso:</h6>
                        <div id="contenedor-pasos" class="p-3 bg-white border rounded"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Script para construcción dinámica y comunicación con el Servidor -->
    <script>
        // Función para generar la matriz n x n en el DOM
        function generarMatriz() {
            const n = parseInt(document.getElementById('dimension').value);
            const contenedor = document.getElementById('contenedor-matriz');
            
            let html = '<table class="table table-bordered align-middle text-center"><thead><tr>';
            for (let j = 0; j < n; j++) {
                html += `<th>x${j+1}</th>`;
            }
            html += '<th class="table-primary">= b</th></tr></thead><tbody>';

            for (let i = 0; i < n; i++) {
                html += '<tr>';
                for (let j = 0; j < n; j++) {
                    html += `<td><input type="number" step="any" class="form-control form-control-sm text-center coef-a" data-row="${i}" data-col="${j}" value="0"></td>`;
                }
                html += `<td class="table-primary"><input type="number" step="any" class="form-control form-control-sm text-center vector-b" data-row="${i}" value="0"></td>`;
                html += '</tr>';
            }
            html += '</tbody></table>';
            contenedor.innerHTML = html;
        }

        // Muestra u oculta la sección de tolerancia e iteraciones según el método seleccionado
        function gestionarParametrosIterativos() {
            const metodo = document.getElementById('metodo').value;
            const seccion = document.getElementById('seccion-iterativos');
            if (metodo === 'JACOBI' || metodo === 'GAUSS_SEIDEL') {
                seccion.style.display = 'flex';
            } else {
                seccion.style.display = 'none';
            }
        }

        // Lee los valores de las celdas y envía el JSON al endpoint del backend
        function enviarSistema() {
            const n = parseInt(document.getElementById('dimension').value);
            const matrizA = Array.from({ length: n }, () => new Array(n).fill(0));
            const vectorB = new Array(n).fill(0);

            // Poblar matriz A
            document.querySelectorAll('.coef-a').forEach(input => {
                const r = parseInt(input.dataset.row);
                const c = parseInt(input.dataset.col);
                matrizA[r][c] = parseFloat(input.value) || 0;
            });

            // Poblar vector b
            document.querySelectorAll('.vector-b').forEach(input => {
                const r = parseInt(input.dataset.row);
                vectorB[r] = parseFloat(input.value) || 0;
            });

            const payload = {
                metodo: document.getElementById('metodo').value,
                dimension: n,
                matrizA: matrizA,
                vectorB: vectorB,
                tolerancia: parseFloat(document.getElementById('tolerancia').value) || 0.0001,
                maxIteraciones: parseInt(document.getElementById('maxIteraciones').value) || 100
            };

            // Resetear vistas de resultado/error
            document.getElementById('seccion-resultados').style.display = 'none';
            document.getElementById('alerta-error').style.display = 'none';

            // Petición al endpoint mapeado en SistemasController
            fetch('/sistemas-lineales/calcular', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(async response => {
                const data = await response.json();
                if (!response.ok || !data.exito) {
                    throw new Error(data.mensaje || "Ocurrió un error al procesar el sistema.");
                }
                return data;
            })
            .then(data => {
                // Renderizar el vector de soluciones (x1, x2, ...)
                const divSolucion = document.getElementById('vector-solucion');
                divSolucion.innerHTML = '';
                data.solucion.forEach((val, idx) => {
                    divSolucion.innerHTML += `
                        <div class="col">
                            <div class="p-2 border rounded bg-light">
                                <span class="fw-bold text-primary">x${idx + 1} = </span>
                                <span>${val}</span>
                            </div>
                        </div>`;
                });

                // Renderizar las tablas o texto de cada paso
                const divPasos = document.getElementById('contenedor-pasos');
                divPasos.innerHTML = '';
                data.pasos.forEach(paso => {
                    divPasos.innerHTML += `<div class="mb-3">${paso}</div>`;
                });

                // Mostrar la sección de resultados
                document.getElementById('seccion-resultados').style.display = 'block';
            })
            .catch(error => {
                document.getElementById('mensaje-error').innerText = error.message;
                document.getElementById('alerta-error').style.display = 'block';
            });
        }

        // Inicialización al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            generarMatriz();
            gestionarParametrosIterativos();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
