<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8. Ajuste de Funciones</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .card-custom {
            max-width: 900px;
            margin: 30px auto;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <!-- Menú Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/}">Métodos Numéricos</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/raices}">1. Raíces</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/sistemas-lineales}">2. Sistemas Lineales</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/ajuste}">3. Ajuste Curvas</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/derivacion}">4. Derivación</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/integracion}">5. Integración</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/ecuaciones-diferenciales}">6. Ecuaciones Dif.</a></li>
                    <li class="nav-item"><a class="nav-link text-warning" th:href="@{/sistemas-avanzados}">7. Sistemas Avanzados</a></li>
                    <li class="nav-item"><a class="nav-link text-info fw-bold active" th:href="@{/ajuste-funciones}">8. Ajuste de Funciones</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Formulario Principal -->
    <div class="container">
        <div class="card card-custom p-4 bg-white">
            <h2 class="text-primary mb-4"><i class="bi bi-graph-up-arrow me-2"></i>Módulo 8: Ajuste de Funciones</h2>
            
            <form th:action="@{/ajuste-funciones/calcular}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold">Selecciona el Método:</label>
                    <select name="metodo" class="form-select" required>
                        <option value="newton">Diferencias Divididas de Newton (Interpolación)</option>
                        <option value="lagrange">Polinomio de Lagrange (Interpolación)</option>
                        <option value="regresion">Regresión Lineal Simple</option>
                    </select>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Valores de X (separados por coma):</label>
                        <input type="text" name="xVals" class="form-control" placeholder="Ejemplo: 1, 2, 3, 4" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Valores de Y (separados por coma):</label>
                        <input type="text" name="yVals" class="form-control" placeholder="Ejemplo: 2, 5, 10, 17" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Valor a evaluar X (Opcional para Interpolación):</label>
                    <input type="number" step="any" name="xEval" class="form-control" value="0">
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold">Calcular</button>
            </form>

            <!-- Resultado -->
            <div th:if="${resultado}" class="alert alert-success mt-4">
                <h5 class="alert-heading fw-bold"><i class="bi bi-check-circle-fill me-2"></i>Resultado:</h5>
                <pre class="mb-0 fs-6" style="white-space: pre-wrap;" th:text="${resultado}"></pre>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
