<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistemas de Ecuaciones Avanzados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Menú de Navegación con la Opción 7 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/}">Métodos Numéricos</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/raices}">1. Raíces</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/sistemas-lineales}">2. Sistemas Lineales</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/ajuste}">3. Ajuste Curvas</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/derivacion}">4. Derivación</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/integracion}">5. Integración</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/ecuaciones-diferenciales}">6. Ecuaciones Dif.</a></li>
                    <!-- OPCIÓN 7 AGREGADA -->
                    <li class="nav-item"><a class="nav-link active fw-bold text-warning" th:href="@{/sistemas-avanzados}">7. Sistemas Avanzados</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="card shadow p-4">
            <h2 class="text-primary mb-4"><i class="bi bi-calculator me-2"></i>Sistemas de Ecuaciones (Directos e Iterativos)</h2>
            
            <form th:action="@{/sistemas-avanzados/calcular}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold">Selecciona el Método:</label>
                    <select name="metodo" class="form-select" required>
                        <option value="determinantes">Determinantes (Cramer)</option>
                        <option value="gauss">Eliminación Gaussiana</option>
                        <option value="gauss-jordan">Gauss-Jordan</option>
                        <option value="jacobi">Jacobi (Iterativo)</option>
                        <option value="gauss-seidel">Gauss-Seidel (Iterativo)</option>
                    </select>
                </div>

                <p class="fw-bold">Ingrese los coeficientes del sistema 2x2:</p>
                <div class="row g-2 mb-3">
                    <div class="col"><input type="number" step="any" name="a11" class="form-control" placeholder="a11" required value="10"></div>
                    <div class="col"><input type="number" step="any" name="a12" class="form-control" placeholder="a12" required value="-1"></div>
                    <div class="col-1 text-center font-bold">=</div>
                    <div class="col"><input type="number" step="any" name="b1" class="form-control" placeholder="b1" required value="9"></div>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col"><input type="number" step="any" name="a21" class="form-control" placeholder="a21" required value="-1"></div>
                    <div class="col"><input type="number" step="any" name="a22" class="form-control" placeholder="a22" required value="10"></div>
                    <div class="col-1 text-center font-bold">=</div>
                    <div class="col"><input type="number" step="any" name="b2" class="form-control" placeholder="b2" required value="9"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Calcular</button>
            </form>

            <!-- Resultados -->
            <div th:if="${resultado}" class="alert alert-success mt-4">
                <h4>Resultado:</h4>
                <p class="fs-5 fw-bold mb-0" th:text="${resultado}"></p>
            </div>

            <div th:if="${historial}" class="mt-4">
                <h4>Historial de Iteraciones:</h4>
                <ul class="list-group">
                    <li th:each="step : ${historial}" class="list-group-item" th:text="${step}"></li>
                </ul>
            </div>

            <div th:if="${error}" class="alert alert-danger mt-4" th:text="${error}"></div>
        </div>
    </div>
</body>
</html>
